name: nav-discounts
on:
  schedule:
    - cron: "40 23 * * 1-5"   # weekdays, after funds publish the day's NAV
    - cron: "40 13 * * 1-5"   # weekday mornings, catches late NAVs
  workflow_dispatch:
  push:
    paths: ["scripts/nav_discounts.mjs", ".github/workflows/nav-discounts.yml"]
permissions:
  contents: write
concurrency: { group: nav-discounts, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/nav_discounts.mjs
        timeout-minutes: 5
      - name: Save nav_discounts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nav_discounts.json
          git diff --cached --quiet && exit 0
          git commit -m "nav discounts: refresh"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
