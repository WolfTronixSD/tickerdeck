name: backtest
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays
  workflow_dispatch:
    inputs:
      syms:
        description: "Comma-separated tickers (blank = all Bargain and Spring Coil stocks)"
        required: false
  push:
    paths: ["scripts/backtest.mjs", ".github/workflows/backtest.yml"]
permissions:
  contents: write
concurrency: { group: backtest, cancel-in-progress: false }
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe SEC access
        run: |
          B="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in https://www.sec.gov/files/company_tickers.json https://www.sec.gov/include/ticker.txt "https://efts.sec.gov/LATEST/search-index?keysTyped=KO" https://data.sec.gov/submissions/CIK0000021344.json; do
            echo "$u => $(curl -s -o /dev/null -w '%{http_code}' -A "$B" -H 'Accept: */*' "$u") / $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (X11; Linux x86_64) GoldRabbit' "$u")"
          done
          curl -s -A "Mozilla/5.0 (X11; Linux x86_64) GoldRabbit" "https://efts.sec.gov/LATEST/search-index?keysTyped=KO" | head -c 400; echo
      - run: node scripts/backtest.mjs
        timeout-minutes: 20
        env:
          SYMS: ${{ github.event.inputs.syms }}
      - name: Save backtest.json
        if: ${{ github.event.inputs.syms == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "backtest: refresh results"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
